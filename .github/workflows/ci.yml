name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: quarkus_test
          POSTGRES_PASSWORD: quarkus_test
          POSTGRES_DB: quarkus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: ./mvnw clean verify -Dquarkus.profile=test
      
    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: target/jacoco-report/
        
    - name: Check Code Coverage
      run: |
        # This is a simple check, in a real scenario you might want to use a tool to fail the build if coverage is below 80%
        # For now, we just ensure it builds and tests pass.
        echo "Code coverage report uploaded as artifact."
